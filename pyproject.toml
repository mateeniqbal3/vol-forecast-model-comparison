[project]
name = "vol-forecast-model-comparison"
version = "0.1.0"
description = "Simple (EWMA/GARCH) vs. complex ML volatility forecasting, compared under naive and proper walk-forward validation, with an honest verdict on whether complexity was justified."
authors = [{ name = "Mateen Iqbal" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
